<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G-Keep</title>
    <link rel="stylesheet" href="./src/controller/style.css" />
    <link rel="stylesheet" href="./src/controller/noteStyle.css" />
    <link href="https://fonts.cdnfonts.com/css/product-sans" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="topmenu">
      <div class="topmenu__menu-logo">
        <button alt="mainmenu" title="Navigation Menu" class="topmenu__menu">
          <i class="fa fa-bars" aria-hidden="true"></i>
        </button>
        <div class="topmenu__keep" title="Google Keep">Google Keep</div>
      </div>

      <div class="topmenu__searchbar">
        <div class="topmenu__search-wrapper" title="Type here to search note">
          <i class="fa fa-search" aria-hidden="true"></i>
          <input
            id="topmenu__bar"
            class="topmenu__bar"
            type="text"
            placeholder="Search"
          />
        </div>

        <button
          class="topmenu__btn"
          id="refresh"
          alt="refresh option"
          title="refresh"
        >
          <i
            class="fa fa-refresh topmenu_optn topmenu__optn--refresh"
            aria-hidden="true"
          ></i>
        </button>
        <i
          class="fa fa-list topmenu__optn"
          aria-hidden="true"
          alt="list view option"
          title="list view"
        ></i>
      </div>
    </header>
    <hr />

    <div class="content">
      <aside class="leftmenu hide">
        <!--The <aside> content is placed as a sidebar in a document.-->
        <button
          class="leftmenu__optn"
          id="notes-section"
          title="Move to Notes section"
        >
          Notes Section
        </button>
        <button
          class="leftmenu__optn"
          id="trash-section"
          title="Move to Trash section"
        >
          Trash Section
        </button>
      </aside>
      <section class="notes">
        <div class="notes__create" title="Create a note">
          <div class="notes__create-bar" id="createNote">
            <i class="fa fa-plus-circle" aria-hidden="true"></i>
            <input
              type="text"
              class="notes__create-input"
              placeholder="Take a note..."
            />
          </div>
        </div>
        <div class="notes__title notes__title--pinned" title="Pinned Notes">
          Pinned Notes
        </div>
        <div class="notes__pinned" title="Pinned notes"></div>
        <div class="notes__title notes__title--notes" title="Notes">Notes</div>
        <div class="notes__layout" title="Notes"></div>
        <div class="notes__title notes__title--trash" title="Trash Notes">
          Trash Notes
        </div>
        <div class="notes__trash" title="Trash notes"></div>
      </section>
    </div>

    <div id="popupOverlay" class="popup-overlay hide"></div>
    <!-- Popup Message -->
    <div id="popupContainer" class="popup hide">
      <h3 class="popup__heading">Create New Note</h3>
      <span class="close-btn">&times;</span>
      <div class="popup__inner">
        <input
          id="notetitle"
          class="popup__input"
          type="text"
          placeholder="Title"
          title="Enter title"
        />
      </div>
      <div class="popup__inner--descrp">
        <textarea
          id="notedescription"
          class="popup__input--descrp"
          placeholder="Enter note here..."
          title="Enter description"
        ></textarea>
      </div>
      <div class="popup__inner popup__inner--button">
        <button class="popup__btn" id="createNoteButton">Create</button>
      </div>
    </div>

    <div id="popupContainer-edit" class="popup hide">
      <span class="close-btn">&times;</span>
      <div class="popup__inner">
        <input
          id="notetitle-edit"
          class="popup__edit"
          type="text"
          title="title"
        />
      </div>
      <div class="popup__inner">
        <div id="notedescription-edit" class="popup__edit--descrp"></div>
      </div>
      <div class="popup__inner popup__inner--button">
        <button class="popup__btn" id="editNoteButton">Save</button>
      </div>
    </div>

    <!-- Loading Spinner -->
    <div id="spinner-overlay" class="spinner-overlay" style="display: none">
      <div class="spinner"></div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script type="module" src="/src/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  </body>
</html>
